<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend</title>
  </head>
  <body>
    <h1>Bienvenue sur votre projet multi-conteneurs Docker</h1>
    <p>API status : <span id="status">Chargement...</span></p>

    <script>
      // On interroge Nginx qui fait le pont vers le Backend
      fetch("http://localhost:8080/api/status")
        .then((response) => {
          if (!response.ok) {
            throw new Error("API inaccessible");
          }
          return response.json();
        })
        .then((data) => {
          // Correction du mot-clé textContent
          document.getElementById("status").textContent =
            `En ligne : ${data.currentTime}`;
        })
        .catch((error) => {
          console.error("Erreur capturée :", error);
          document.getElementById("status").textContent = "API inaccessible";
        });
    </script>
  </body>
</html>
